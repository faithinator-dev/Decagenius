<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decagenius - App</title>
    <link rel="stylesheet" href="app.css">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
</head>
<body>
    <div class="container">
        <header>
            <h1>Decagenius</h1>
            <p>Your Personal Council of AI Experts</p>
        </header>

        <main>
            <div class="agent-selector-container">
                <label for="agent-selector">Choose an Agent:</label>
                <select id="agent-selector">
                    <!-- Options will be populated by app.js -->
                </select>
            </div>

            <div id="chat-window">
                <div id="chat-history"></div>
                <div class="chat-input">
                    <textarea id="prompt-input" placeholder="Enter your prompt here..."></textarea>
                    <button id="send-button">Send</button>
                </div>
            </div>
        </main>

        <footer>
            <p>Built with Vanilla JS, Node.js, and the Gemini API.</p>
        </footer>
    </div>
    <script src="app.js"></script>
</body>
</html>
